# SMART disk alerts for the TrueNasty (192.168.4.111) server-monitor sensors.
#
# Three automations:
#   1. Drive reports FAILURE      -> SMART health or a self-test failed: act now
#   2. Error counters INCREASING  -> new bad sectors / defects / link errors
#   3. ZFS pool not healthy       -> a drive faulted or vanished
#
# ---------------------------------------------------------------------------
# READ THIS BEFORE EDITING ENTITY IDS. Verified against the live state machine
# on 2026-09-25, and every assumption below had been wrong until then:
#
#   * These automations had never been installed in Home Assistant at all. An
#     audit of every automation config found zero references to truenasty,
#     smart_ok, selftest or pool_. Writing the YAML is not installing it.
#   * Entity ids are NOT sensor.truenasty_disk_<serial>_<key>. Older entities
#     were registered before the discovery payload pinned object_id, so their
#     ids were welded from the friendly name at first discovery:
#     sensor.truenasty_disk_sdb_smart_ok, plus a _2 suffix where the letter
#     collided.
#   * That letter is the one the kernel used when the entity was FIRST seen and
#     never updates. Serial 7PK6P6GC is physically /dev/sdd today, and answers
#     to sensor.truenasty_disk_sda_smart_ok_2. Do not infer a drive from its
#     entity id; map through unique_id (server_monitor_truenasty_<key>) instead.
#
# Alert 1 therefore matches by PATTERN over both id shapes, so it covers the
# welded legacy ids, the key-shaped ids new entities now get, and any drive
# added later. Alert 2 needs explicit ids (HA state triggers take no patterns) —
# the list below is the verified mapping, and alert 1 is the net beneath it.
#
# To install: Settings -> Automations & Scenes -> Create Automation ->
# "Start with an empty automation" -> three-dot menu -> Edit in YAML -> paste
# one item (without its leading "- ") -> Save. Repeat for each. Then confirm
# they exist: Developer Tools -> Template ->
#   {{ states.automation | map(attribute='name') | list }}
# Notifications are persistent notifications; to also push to your phone add,
# in the same actions list:
#   - service: notify.mobile_app_<your_phone>
#     data: {title: "{{ title }}", message: "{{ message }}"}
# ---------------------------------------------------------------------------

- id: truenasty_smart_health_failed
  alias: "TrueNasty: disk SMART health or self-test FAILED"
  description: >-
    Any drive whose firmware reports failure, or whose last self-test failed.
    Matches every disk health entity by pattern - both the legacy welded ids and
    the key-shaped ones - so newly installed drives are covered automatically.
  mode: single
  trigger:
    - platform: template
      value_template: >-
        {{ states.sensor
           | selectattr('entity_id', 'search',
                        '^sensor\.truenasty_disk_.*_(smart_ok|self_?test_ok)(_\d+)?$')
           | selectattr('state', 'in', ['0', '0.0'])
           | list | count > 0 }}
  action:
    - variables:
        failing: >-
          {{ states.sensor
             | selectattr('entity_id', 'search',
                          '^sensor\.truenasty_disk_.*_(smart_ok|self_?test_ok)(_\d+)?$')
             | selectattr('state', 'in', ['0', '0.0'])
             | map(attribute='name') | list | join(', ') }}
    - service: persistent_notification.create
      data:
        title: "🔴 TrueNAS drive reports FAILURE"
        message: >-
          Failing: {{ failing }}.
          A SMART health failure is usually terminal; a failed self-test means
          the drive could not read part of its own surface. Check `zpool status`
          and replace the drive. If it is a boot-pool member, do not resilver
          onto it.

- id: truenasty_smart_counters_rising
  alias: "TrueNasty: disk error counters increasing"
  description: >-
    A drive's defect / bad-sector / link-error counter went up. These are
    cumulative, so any increase means new damage since the last reading.
  mode: single
  trigger:
    - platform: state
      entity_id:
        # 8x 10TB SAS - grown defect list (the reallocated-sector equivalent).
        # Comment gives the real drive; the sdX in the id is meaningless.
        - sensor.truenasty_disk_sda_grown_defects   # 7PK6P6GC
        - sensor.truenasty_disk_sdb_grown_defects   # 7GJ310BK
        - sensor.truenasty_disk_sde_grown_defects   # ZRT0L5F80000W3257EK1
        - sensor.truenasty_disk_sdf_grown_defects   # 7PKAW5HG
        - sensor.truenasty_disk_sdh_grown_defects   # ZRT0L66Z0000W324NTT8
        - sensor.truenasty_disk_sdj_grown_defects   # ZRT0L60A0000W325RR1P
        - sensor.truenasty_disk_sdk_grown_defects   # ZRT0L58H0000W3257EXA
        - sensor.truenasty_disk_sdl_grown_defects   # 7PK85E1G
        # 4TB SATA boot drive WCK44PKZ - ATA attributes
        - sensor.truenasty_disk_sdm_crc_errors
        - sensor.truenasty_disk_sdm_pending_sectors
        - sensor.truenasty_disk_sdm_reallocated_sectors
        - sensor.truenasty_disk_sdm_uncorrectable_sectors
        # 4TB SATA WD-WX62D215AJHF - the failing replacement drive.
        # NOTE: its counter ids share the sdj letter with ZRT0L60A's defects
        # entity above. Different suffixes, different drives.
        - sensor.truenasty_disk_sdj_crc_errors
        - sensor.truenasty_disk_sdj_pending_sectors
        - sensor.truenasty_disk_sdj_reallocated_sectors
        - sensor.truenasty_disk_sdj_uncorrectable_sectors
  condition:
    - condition: template
      value_template: >-
        {{ trigger.from_state is not none and trigger.to_state is not none
        and trigger.from_state.state not in ['unknown','unavailable','none']
        and trigger.to_state.state not in ['unknown','unavailable','none']
        and (trigger.to_state.state | float(-1)) > (trigger.from_state.state | float(-1)) }}
  action:
    - service: persistent_notification.create
      data:
        title: "🟠 TrueNAS drive errors increasing"
        message: >-
          {{ trigger.to_state.attributes.friendly_name }} rose from
          {{ trigger.from_state.state }} to {{ trigger.to_state.state }}.
          Grown defects / reallocated / pending sectors mean failing media - scrub
          the pool and plan a replacement. UDMA CRC errors instead mean a cable or
          link fault: reseat or replace that drive's cable.

- id: truenasty_zfs_pool_unhealthy
  alias: "TrueNasty: ZFS pool not healthy"
  description: >-
    A pool left the ONLINE state - a drive faulted, vanished, or the pool is
    resilvering/degraded. This is what catches a disk that disappears outright,
    which the per-disk sensors cannot.
  mode: single
  trigger:
    - platform: numeric_state
      below: 1
      entity_id:
        # These two ids are verified to exist and match.
        - sensor.truenasty_pool_backup_healthy
        - sensor.truenasty_pool_boot_pool_healthy
  action:
    - service: persistent_notification.create
      data:
        title: "\U0001F534 TrueNAS pool is not ONLINE"
        message: >-
          {{ trigger.to_state.attributes.friendly_name }} reports
          {{ states(trigger.entity_id | replace('_healthy', '_state')) }}.
          Run `zpool status -v` on the NAS: a drive has faulted or gone missing.
          The pool keeps serving data while degraded, but it has lost redundancy -
          replace the faulted drive before a second one goes.
